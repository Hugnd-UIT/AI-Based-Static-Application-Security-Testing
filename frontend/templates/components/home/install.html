<section class="sec" id="download-cli" style="padding-top: 60px; padding-bottom: 80px;">
  <style>
    .install-tab {
      background: none;
      border: none;
      outline: none;
      padding: 16px 8px;
      cursor: pointer;
      font-family: var(--f-sans, inherit);
      font-size: 0.85rem;
      font-weight: 600;
      transition: all var(--motion-fast, 0.2s);
      color: rgba(255, 255, 255, 0.4);
      border-bottom: 2px solid transparent;
      margin-top: 2px;
    }

    .install-tab:hover,
    .install-tab:focus-visible {
      color: rgba(255, 255, 255, 0.8);
    }

    .install-tab.active {
      color: var(--fire, #ff4a14);
      border-bottom-color: var(--fire, #ff4a14);
      text-shadow: 0 0 10px rgba(255, 74, 20, 0.2);
    }

    .install-box {
      background: #0a0d14;
      border: 1px solid rgba(255, 74, 20, 0.2);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px 0 rgba(0, 0, 0, 0.6);
      margin-top: 48px;
      overflow: hidden;
    }

    .install-header {
      display: flex;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid rgba(255, 74, 20, 0.15);
      background: rgba(255, 255, 255, 0.02);
      justify-content: space-between;
    }

    .install-dots {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 20px;
    }

    .install-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .install-copy {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      color: var(--g400, #94a3b8);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all var(--motion-fast, 0.2s);
      outline: none;
      flex-shrink: 0;
    }

    .install-copy:hover,
    .install-copy:focus-visible {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .install-copy.copied {
      color: var(--emerald, #10b981);
      border-color: rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.1);
    }
  </style>

  <div class="ctn" style="max-width: 1100px; margin: 0 auto;">

    <div class="sec-hd rv" style="text-align: center;">
      <h2 class="sec-t">
        Get Started in <span class="txt-fire">Seconds</span>
      </h2>
      <p class="sec-sub">Install locally. No data leaves your machine.</p>
    </div>

    <div class="rv install-box">

      <div class="install-header">
        <div style="display: flex; align-items: center;">
          <div class="install-dots" aria-hidden="true">
            <div class="install-dot" style="background: #ff5f57;"></div>
            <div class="install-dot" style="background: #ffbd2e;"></div>
            <div class="install-dot" style="background: #28c840;"></div>
          </div>
          <span
            style="font-family: var(--f-mono); font-size: 0.75rem; font-weight: 700; color: rgba(255, 255, 255, 0.3); letter-spacing: 0.05em; user-select: none; line-height: 1; transform: translateY(1px);">
            INSTALL SINFUL CLI
          </span>
        </div>

        <div role="tablist" aria-label="Installation Methods" style="display: flex; gap: 16px;">
          <button role="tab" aria-selected="false" onclick="switchTab('npm')" id="tab-npm"
            class="install-tab">npm</button>
          <button role="tab" aria-selected="true" onclick="switchTab('unix')" id="tab-unix"
            class="install-tab active">Linux & macOS</button>
          <button role="tab" aria-selected="false" onclick="switchTab('windows')" id="tab-windows"
            class="install-tab">Windows</button>
        </div>
      </div>

      <div
        style="padding: 32px 40px; position: relative; font-family: var(--f-mono); display: flex; align-items: center; justify-content: space-between;">

        <div
          style="position: absolute; top: 50%; left: 15%; width: 400px; height: 120px; background: var(--fire, #ff4a14); filter: blur(100px); opacity: 0.05; transform: translateY(-50%); pointer-events: none;">
        </div>

        <div style="display: flex; flex-direction: column; gap: 12px; z-index: 1; flex: 1;">
          <div id="cmd-desc" style="color: rgba(255,255,255,0.3); font-size: 0.9rem; transition: opacity 0.15s ease;"
            aria-live="polite">
            # Quick install script for macOS and Linux
          </div>
          <div style="display: flex; align-items: center; gap: 20px; font-size: 1.1rem;">
            <span style="color: var(--fire); font-weight: 700; user-select: none;" aria-hidden="true">$</span>
            <code id="cmd-code"
              style="color: #fff; letter-spacing: 0.5px; word-break: break-all; transition: opacity 0.15s ease;"
              aria-live="polite">curl -sL https://sinful.dev/install.sh | bash</code>
          </div>
        </div>

        <button onclick="copyCmd()" id="btn-copy" class="install-copy" aria-label="Copy command to clipboard"
          style="z-index: 1;">
          <svg id="copy-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="copy-text" style="font-size: 0.9rem; font-family: var(--f-mono); font-weight: 600;">Copy</span>
        </button>

      </div>
    </div>
  </div>

  <script>
    let currentTab = 'unix';

    const commands = {
      'npm': { desc: '# Global installation via NPM', cmd: 'npm install -g sinful' },
      'unix': { desc: '# Quick install script for macOS and Linux', cmd: 'curl -sL https://sinful.dev/install.sh | bash' },
      'windows': { desc: '# Quick install script for Windows', cmd: 'powershell -c "irm https://sinful.dev/install.ps1 | iex"' }
    };

    function switchTab(tab) {
      currentTab = tab;

      ['npm', 'unix', 'windows'].forEach(t => {
        const el = document.getElementById('tab-' + t);
        if (t === currentTab) {
          el.classList.add('active');
          el.setAttribute('aria-selected', 'true');
        } else {
          el.classList.remove('active');
          el.setAttribute('aria-selected', 'false');
        }
      });

      const cmdDesc = document.getElementById('cmd-desc');
      const cmdCode = document.getElementById('cmd-code');

      cmdDesc.style.opacity = '0';
      cmdCode.style.opacity = '0';

      setTimeout(() => {
        cmdDesc.innerText = commands[currentTab].desc;
        cmdCode.innerText = commands[currentTab].cmd;
        cmdDesc.style.opacity = '1';
        cmdCode.style.opacity = '1';
      }, 150);
    }

    function copyCmd() {
      const cmd = commands[currentTab].cmd;
      navigator.clipboard.writeText(cmd);

      const btn = document.getElementById('btn-copy');
      const icon = document.getElementById('copy-icon');
      const text = document.getElementById('copy-text');

      btn.classList.add('copied');
      icon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
      text.innerText = 'Copied!';

      setTimeout(() => {
        btn.classList.remove('copied');
        icon.innerHTML = '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>';
        text.innerText = 'Copy';
      }, 2000);
    }
  </script>
</section>
