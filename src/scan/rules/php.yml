rules:
  - id: sinful-taint-php
    mode: taint
    message: "Potential vulnerability: tainted data flows from user-controlled source to dangerous sink."
    severity: WARNING
    languages: [php]
    pattern-sources:
      # Param flow
      - patterns:
          - pattern-inside: |
              function $FN(..., $P, ...) { ... }
          - pattern: $P

      # Native PHP Superglobals
      - pattern: $_GET
      - pattern: $_GET[$KEY]
      - pattern: $_POST
      - pattern: $_POST[$KEY]
      - pattern: $_REQUEST
      - pattern: $_REQUEST[$KEY]
      - pattern: $_COOKIE
      - pattern: $_COOKIE[$KEY]
      - pattern: $_SERVER
      - pattern: $_SERVER[$KEY]
      - pattern: $_FILES
      - pattern: $_FILES[$KEY]
      - pattern: $_ENV
      - pattern: '"php://input"'
      - pattern: file_get_contents("php://input")

      # Laravel 
      - pattern: $request->query(...)
      - pattern: $request->input(...)
      - pattern: $request->post(...)
      - pattern: $request->get(...)
      - pattern: $request->header(...)
      - pattern: $request->cookie(...)
      - pattern: $request->file(...)
      - pattern: $request->all()
      - pattern: $request->json(...)

      # Symfony 
      - pattern: $request->query->get(...)
      - pattern: $request->request->get(...)
      - pattern: $request->headers->get(...)
      - pattern: $request->cookies->get(...)
      - pattern: $request->files->get(...)

      # General 
      - pattern: getenv(...)
      - pattern: filter_input(...)
    pattern-sinks:
      # SQL Injection 
      - pattern: mysqli_query(...)
      - pattern: $MYSQLI->query(...)
      - pattern: $PDO->query(...)
      - pattern: $PDO->exec(...)
      - pattern: $USE_DB->execute(...)
      - pattern: $STMT->execute(...)
      - pattern: mysql_query(...)

      # Laravel raw SQL 
      - pattern: DB::select(...)
      - pattern: DB::statement(...)
      - pattern: DB::unprepared(...)
      - pattern: $BUILDER->whereRaw(...)
      - pattern: $BUILDER->selectRaw(...)
      - pattern: $BUILDER->orderByRaw(...)
      - pattern: $BUILDER->havingRaw(...)

      # Command Injection 
      - pattern: shell_exec(...)
      - pattern: system(...)
      - pattern: exec(...)
      - pattern: passthru(...)
      - pattern: proc_open(...)
      - pattern: popen(...)
      - pattern: "`$RUN_CMD`"

      # Code Execution 
      - pattern: eval(...)
      - pattern: create_function(...)
      - pattern: assert(...)
      - pattern: preg_replace("/...e.../", ...)

      # Path Traversal / File Inclusion 
      - pattern: file_get_contents(...)
      - pattern: file_put_contents(...)
      - pattern: fopen(...)
      - pattern: readfile(...)
      - pattern: include(...)
      - pattern: include_once(...)
      - pattern: require(...)
      - pattern: require_once(...)
      - pattern: move_uploaded_file(...)

      # SSRF 
      - pattern: curl_setopt($CH, CURLOPT_URL, ...)
      - pattern: file_get_contents("http://...")

      # XSS
      - pattern: echo $DATA;
      - pattern: print(...)
      - pattern: print_r(...)
      - pattern: printf(...)
      - pattern: header($LOC)

      # Deserialization 
      - pattern: unserialize(...)

      # LDAP 
      - pattern: ldap_search(...)
      - pattern: ldap_bind(...)
    pattern-sanitizers:
      # SQL 
      - pattern: $PDO->prepare(...)
      - pattern: $MYSQLI->prepare(...)
      - pattern: mysqli_real_escape_string(...)
      - pattern: addslashes(...)

      # HTML / XSS 
      - pattern: htmlspecialchars(...)
      - pattern: htmlentities(...)
      - pattern: strip_tags(...)

      # Path 
      - pattern: basename(...)
      - pattern: realpath(...)

      # URL 
      - pattern: urlencode(...)
      - pattern: rawurlencode(...)

      # Validation 
      - pattern: filter_var(...)
      - pattern: intval(...)
      - pattern: floatval(...)

  # Dynamic SQL/Cmd
  - id: sinful-strcat-php
    message: "SQL or command string built from a variable; verify the value is not attacker controlled."
    severity: WARNING
    languages: [php]
    pattern-either:
      - pattern-regex: '(?i)"(?:\\.|[^"\n]){0,200}(\$where|\b(select|insert|update|delete|drop|union|ping|curl|wget|nc|bash)\b)(?:\\.|[^"\n]){0,200}(\$\{|\$[a-z_]|#\{|\{\}|%[sdvq])'
      - pattern-regex: '(?i)"(?:\\.|[^"\n]){0,200}\b(select|insert|update|delete|drop|union|ping|curl|wget)\b(?:\\.|[^"\n]){0,200}"\s*[+.]\s*[a-z_$]'

  # Weak crypto
  - id: sinful-weakcrypto-php
    message: "Weak or broken cryptographic algorithm."
    severity: WARNING
    languages: [php]
    pattern-regex: '(?i)\b(md5|sha1|des|rc4|ecb|md4)\b'

  # Hardcoded secret
  - id: sinful-secret-php
    message: "Hardcoded credential or cryptographic key."
    severity: WARNING
    languages: [php]
    pattern-regex: '(?i)(\b(secret|password|passwd|pwd|api_?key|private_?key|access_?key|token|salt|encryption_?key|hardcoded)\w*|\b(key|iv|creds?|credential)\b)\s*(=|:|:=|=>)\s*["''][^"''\n]{4,}["'']'