rules:
  - id: sinful-taint-scala
    mode: taint
    message: "Potential vulnerability: tainted data flows from user-controlled source to dangerous sink."
    severity: WARNING
    languages: [scala]
    pattern-sources:
      # Param flow
      - patterns:
          - pattern-inside: |
              def $FN(..., $P: $T, ...) = ...
          - pattern: $P

      # Play Framework
      - pattern: request.getQueryString(...)
      - pattern: request.body.asFormUrlEncoded
      - pattern: request.body.asJson
      - pattern: request.body.asText
      - pattern: request.body.asXml
      - pattern: request.headers.get(...)
      - pattern: request.cookies.get(...)
      - pattern: request.queryString
      - pattern: request.path
      - pattern: request.rawQueryString

      # Akka HTTP 
      - pattern: parameter(...)
      - pattern: parameters(...)
      - pattern: entity(as[$T])
      - pattern: headerValueByName(...)
      - pattern: cookie(...)

      # Finch / Http4s 
      - pattern: req.params.get(...)
      - pattern: req.headers.get(...)

      # General 
      - pattern: sys.env.get(...)
      - pattern: System.getenv(...)
      - pattern: args(...)
    pattern-sinks:
      # SQL Injection 
      - pattern: $USE_DB.withConnection(...)
      - pattern: $USE_DB.withTransaction(...)
      - pattern: DB.executeQuery(...)
      - pattern: java.sql.DriverManager.getConnection(...)
      - pattern: $STMT.executeQuery(...)
      - pattern: $STMT.execute(...)
      - pattern: $STMT.executeUpdate(...)

      # Slick raw SQL 
      - pattern: sql"..."
      - pattern: sqlu"..."
      - pattern: $USE_SESSION.createSQLQuery(...)
      - pattern: $USE_SESSION.createQuery(...)

      # Anorm 
      - pattern: SQL(...)

      # Command Injection
      - pattern: scala.sys.process.Process(...)
      - pattern: Runtime.getRuntime.exec(...)
      - pattern: ProcessBuilder(...)
      - pattern: $CMD.!
      - pattern: $CMD.!!
      - pattern: Process($CMD).!

      # Path Traversal
      - pattern: scala.io.Source.fromFile(...)
      - pattern: java.io.File(...)
      - pattern: java.io.FileInputStream(...)
      - pattern: java.nio.file.Files.readAllBytes(...)
      - pattern: java.nio.file.Paths.get(...)

      # SSRF 
      - pattern: new java.net.URL(...).openConnection()
      - pattern: scala.io.Source.fromURL(...)
      - pattern: ws.url(...)
      - pattern: $WS.url(...)

      # Deserialization 
      - pattern: java.io.ObjectInputStream(...).readObject()
      - pattern: $OIS.readObject()

      # XSS 
      - pattern: Ok($DATA)
      - pattern: Results.Ok($DATA)
      - pattern: Html(...)

      # LDAP
      - pattern: $CTX.search(...)
      - pattern: InitialDirContext(...).search(...)

      # XML / XXE
      - pattern: XML.loadString(...)
      - pattern: XML.load(...)
      - pattern: scala.xml.XML.loadString(...)
      - pattern: scala.xml.XML.load(...)
    pattern-sanitizers:
      # SQL
      - pattern: $USE_CONN.prepareStatement(...)

      # HTML 
      - pattern: play.twirl.api.HtmlFormat.escape(...)
      - pattern: xml.Utility.escape(...)

      # URL 
      - pattern: java.net.URLEncoder.encode(...)
      
      # Type safe casting 
      - pattern: $STR.toInt
      - pattern: $STR.toLong
      - pattern: $STR.toDouble
      - pattern: Integer.parseInt(...)

  # Dynamic SQL/Cmd
  - id: sinful-strcat-scala
    message: "SQL or command string built from a variable; verify the value is not attacker controlled."
    severity: WARNING
    languages: [scala]
    pattern-either:
      - pattern-regex: '(?i)"(?:\\.|[^"\n]){0,200}(\$where|\b(select|insert|update|delete|drop|union|ping|curl|wget|nc|bash)\b)(?:\\.|[^"\n]){0,200}(\$\{|\$[a-z_]|#\{|\{\}|%[sdvq])'
      - pattern-regex: '(?i)"(?:\\.|[^"\n]){0,200}\b(select|insert|update|delete|drop|union|ping|curl|wget)\b(?:\\.|[^"\n]){0,200}"\s*[+.]\s*[a-z_$]'

  # Weak crypto
  - id: sinful-weakcrypto-scala
    message: "Weak or broken cryptographic algorithm."
    severity: WARNING
    languages: [scala]
    pattern-regex: '(?i)\b(md5|sha1|des|rc4|ecb|md4)\b'

  # Hardcoded secret
  - id: sinful-secret-scala
    message: "Hardcoded credential or cryptographic key."
    severity: WARNING
    languages: [scala]
    pattern-regex: '(?i)(\b(secret|password|passwd|pwd|api_?key|private_?key|access_?key|token|salt|encryption_?key|hardcoded)\w*|\b(key|iv|creds?|credential)\b)\s*(=|:|:=|=>)\s*["''][^"''\n]{4,}["'']'