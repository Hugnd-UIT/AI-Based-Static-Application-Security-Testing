rules:

  - id: sinful-taint-python
    mode: taint
    message: "Potential vulnerability: tainted data flows from user-controlled source to dangerous sink."
    severity: WARNING
    languages: [python]

    pattern-sources:
      # Flask / Werkzeug 

      - pattern: request.json

      - pattern: request.args

      - pattern: request.args.get(...)

      - pattern: request.form

      - pattern: request.form.get(...)

      - pattern: request.values

      - pattern: request.values.get(...)

      - pattern: request.data

      - pattern: request.cookies

      - pattern: request.cookies.get(...)

      - pattern: request.headers

      - pattern: request.headers.get(...)

      - pattern: request.files

      - pattern: request.get_json(...)
      # Django 

      - pattern: request.GET

      - pattern: request.GET.get(...)

      - pattern: request.POST

      - pattern: request.POST.get(...)

      - pattern: request.body

      - pattern: request.META

      - pattern: request.META.get(...)

      - pattern: request.FILES

      - pattern: request.COOKIES

      - pattern: request.COOKIES.get(...)
      # FastAPI 

      - pattern: $GET_VAR = Body(...)

      - pattern: $GET_VAR = Query(...)

      - pattern: $GET_VAR = Path(...)

      - pattern: $GET_VAR = Form(...)

      - pattern: $GET_VAR = Header(...)

      - pattern: $GET_VAR = Cookie(...)

      - pattern: $GET_VAR = File(...)

      - pattern: $GET_VAR = UploadFile(...)
      # General / CLI 

      - pattern: sys.argv

      - pattern: os.environ.get(...)

      - pattern: os.getenv(...)

      - pattern: input(...)

    pattern-sinks:
      # SQL Injection 

      - pattern: $USE_DB.execute(...)

      - pattern: $USE_DB.query(...)

      - pattern: $USE_DB.raw(...)

      - pattern: $USE_CURSOR.execute(...)

      - pattern: $USE_CURSOR.executemany(...)

      - pattern: sqlite3.connect(...).execute(...)

      - pattern: $GET_MODEL.objects.raw(...)

      - pattern: $GET_MODEL.objects.extra(...)

      - pattern: $USE_SESSION.execute(...)

      - pattern: $USE_ENGINE.execute(...)

      - pattern: text(...)                          # SQLAlchemy text 

      - pattern: $USE_CONN.execute(text(...))
      # Command Injection 

      - pattern: subprocess.run(...)

      - pattern: subprocess.Popen(...)

      - pattern: subprocess.call(...)

      - pattern: subprocess.check_output(...)

      - pattern: subprocess.check_call(...)

      - pattern: os.system(...)

      - pattern: os.popen(...)

      - pattern: os.exec(...)

      - pattern: pty.spawn(...)
      # Code Execution / Deserialization 

      - pattern: eval(...)

      - pattern: exec(...)

      - pattern: compile(...)

      - pattern: pickle.loads(...)

      - pattern: pickle.load(...)

      - pattern: marshal.loads(...)

      - pattern: yaml.load(...)

      - pattern: jsonpickle.decode(...)

      - pattern: __import__(...)
      # Path Traversal / File Access 

      - pattern: open(...)

      - pattern: os.path.join(...)

      - pattern: os.path.abspath(...)

      - pattern: pathlib.Path(...)

      - pattern: shutil.copy(...)

      - pattern: shutil.move(...)

      - pattern: os.remove(...)

      - pattern: os.unlink(...)
      # SSRF / HTTP Request Injection 

      - pattern: requests.get(...)

      - pattern: requests.post(...)

      - pattern: requests.put(...)

      - pattern: requests.request(...)

      - pattern: urllib.request.urlopen(...)

      - pattern: httpx.get(...)

      - pattern: httpx.post(...)

      - pattern: aiohttp.ClientSession().get(...)
      # XSS / SSTI 

      - pattern: render_template_string(...)

      - pattern: Markup(...)

      - pattern: jinja2.Template(...).render(...)
      # LDAP Injection 

      - pattern: $USE_CONN.search(...)

      - pattern: ldap3.Connection(...).search(...)
      # XML / XXE 

      - pattern: lxml.etree.fromstring(...)

      - pattern: xml.etree.ElementTree.fromstring(...)

      - pattern: minidom.parseString(...)
      # Redirect 

      - pattern: redirect(...)

      - pattern: flask.redirect(...)

    pattern-sanitizers:
      # SQL 

      - pattern: $USE_DB.escape_string(...)

      - pattern: $USE_CURSOR.mogrify(...)

      - pattern: sqlalchemy.text(...)
      # Shell 

      - pattern: shlex.quote(...)

      - pattern: pipes.quote(...)
      # Path 

      - pattern: os.path.basename(...)

      - pattern: pathlib.Path(...).name
      # HTML / XSS 

      - pattern: html.escape(...)

      - pattern: markupsafe.escape(...)

      - pattern: bleach.clean(...)
      # URL 

      - pattern: urllib.parse.quote(...)

      - pattern: urllib.parse.urlencode(...)
      # Type casting trusted conversions 

      - pattern: int(...)

      - pattern: float(...)

      - pattern: bool(...)
