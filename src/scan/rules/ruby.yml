rules:
  - id: sinful-taint-ruby
    mode: taint
    message: "Potential vulnerability: tainted data flows from user-controlled source to dangerous sink."
    severity: WARNING
    languages: [ruby]
    pattern-sources:
      # Param flow
      - patterns:
          - pattern-inside: |
              def self.$FN(..., $P, ...)
                ...
              end
          - pattern: $P
      - patterns:
          - pattern-inside: |
              def $FN(..., $P, ...)
                ...
              end
          - pattern: $P

      # Rails
      - pattern: params[...]
      - pattern: params.require(...)
      - pattern: params.permit(...)
      - pattern: request.body.read
      - pattern: request.env[...]
      - pattern: request.cookies[...]
      - pattern: request.headers[...]
      - pattern: request.query_parameters[...]
      - pattern: request.request_parameters[...]
      - pattern: request.path_parameters[...]
      - pattern: request.raw_post

      # Sinatra 
      - pattern: env[...]

      # General 
      - pattern: ENV[...]
      - pattern: ARGV[...]
      - pattern: $stdin.gets
    pattern-sinks:
      # SQL Injection 
      - pattern: $USE_DB.execute(...)
      - pattern: ActiveRecord::Base.connection.execute(...)
      - pattern: $GET_MODEL.find_by_sql(...)
      - pattern: $GET_MODEL.where(...)
      - pattern: $GET_MODEL.select(...)
      - pattern: $GET_MODEL.joins(...)
      - pattern: $GET_MODEL.having(...)
      - pattern: $GET_MODEL.order(...)
      - pattern: $GET_MODEL.group(...)

      # Command Injection 
      - pattern: system(...)
      - pattern: exec(...)
      - pattern: "`#{...}`" 
      - pattern: "%x{...}"
      - pattern: Open3.popen3(...)
      - pattern: Open3.capture3(...)
      - pattern: IO.popen(...)
      - pattern: Kernel.exec(...)
      - pattern: Kernel.system(...)

      # Code Execution / Deserialization 
      - pattern: eval(...)
      - pattern: Marshal.load(...)
      - pattern: Marshal.restore(...)
      - pattern: YAML.load(...)
      - pattern: Kernel.load(...)

      # Path Traversal / File Access 
      - pattern: File.open(...)
      - pattern: File.read(...)
      - pattern: IO.read(...)
      - pattern: File.write(...)
      - pattern: File.delete(...)
      - pattern: Pathname.new(...)

      # SSRF
      - pattern: URI.parse(...)
      - pattern: Net::HTTP.get_response(...)
      - pattern: Net::HTTP.start(...)
      - pattern: Net::HTTP.get(...)
      - pattern: open(...)
      - pattern: URI.open(...)
      - pattern: Faraday.get(...)
      - pattern: HTTParty.get(...)

      # Mass Assignment
      - pattern: $H.merge!(...)
      - pattern: $GET_MODEL.update(...)
      - pattern: $GET_MODEL.update_attributes(...)
      - pattern: $GET_MODEL.assign_attributes(...)
      - pattern: $GET_MODEL.new(...)

      # XML / XXE
      - pattern: Nokogiri::XML(...)
      - pattern: Nokogiri::XML::Document.parse(...)
      - pattern: REXML::Document.new(...)

      # XSS / Open Redirect
      - pattern: 'render inline: ...'
      - pattern: redirect_to(...)
    pattern-sanitizers:
      # SQL use ActiveRecord parameterization 
      - pattern: $GET_MODEL.sanitize(...)
      - pattern: ActiveRecord::Base.sanitize_sql(...)

      # HTML 
      - pattern: CGI.escapeHTML(...)
      - pattern: ERB::Util.html_escape(...)
      - pattern: Rack::Utils.escape_html(...)

      # Path 
      - pattern: File.basename(...)
      - pattern: Pathname.new(...).basename

      # URL 
      - pattern: CGI.escape(...)
      - pattern: URI.encode_www_form_component(...)

      # Type casting 
      - pattern: Integer(...)
      - pattern: Float(...)

  # Dynamic SQL/Cmd
  - id: sinful-strcat-ruby
    message: "SQL or command string built from a variable; verify the value is not attacker controlled."
    severity: WARNING
    languages: [ruby]
    pattern-either:
      - pattern-regex: '(?i)"(?:\\.|[^"\n]){0,200}(\$where|\b(select|insert|update|delete|drop|union|ping|curl|wget|nc|bash)\b)(?:\\.|[^"\n]){0,200}(\$\{|\$[a-z_]|#\{|\{\}|%[sdvq])'
      - pattern-regex: '(?i)"(?:\\.|[^"\n]){0,200}\b(select|insert|update|delete|drop|union|ping|curl|wget)\b(?:\\.|[^"\n]){0,200}"\s*[+.]\s*[a-z_$]'

  # Weak crypto
  - id: sinful-weakcrypto-ruby
    message: "Weak or broken cryptographic algorithm."
    severity: WARNING
    languages: [ruby]
    pattern-regex: '(?i)\b(md5|sha1|des|rc4|ecb|md4)\b'

  # Hardcoded secret
  - id: sinful-secret-ruby
    message: "Hardcoded credential or cryptographic key."
    severity: WARNING
    languages: [ruby]
    pattern-regex: '(?i)(\b(secret|password|passwd|pwd|api_?key|private_?key|access_?key|token|salt|encryption_?key|hardcoded)\w*|\b(key|iv|creds?|credential)\b)\s*(=|:|:=|=>)\s*["''][^"''\n]{4,}["'']'