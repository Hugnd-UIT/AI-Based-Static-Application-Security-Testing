rules:
  - id: sinful-taint-go
    mode: taint
    message: "Potential vulnerability: tainted data flows from user-controlled source to dangerous sink."
    severity: WARNING
    languages: [go]

    pattern-sources:
      # net/http 
      - pattern: $REQ.URL.Query()
      - pattern: $REQ.URL.Query().Get(...)
      - pattern: $REQ.FormValue(...)
      - pattern: $REQ.PostFormValue(...)
      - pattern: $REQ.Cookie(...)
      - pattern: $REQ.Header.Get(...)
      - pattern: $REQ.Body
      - pattern: $REQ.URL.Path
      - pattern: $REQ.URL.RawQuery
      # Gin 
      - pattern: $C.Query(...)
      - pattern: $C.DefaultQuery(...)
      - pattern: $C.PostForm(...)
      - pattern: $C.Param(...)
      - pattern: $C.GetHeader(...)
      - pattern: $C.Cookie(...)
      - pattern: $C.ShouldBindJSON(...)
      - pattern: $C.ShouldBind(...)
      # Echo / Fiber 
      - pattern: $CTX.QueryParam(...)
      - pattern: $CTX.FormValue(...)
      - pattern: $CTX.Param(...)
      - pattern: $CTX.Request().Header.Get(...)
      # General 
      - pattern: os.Getenv(...)
      - pattern: os.Args

    pattern-sinks:
      # SQL Injection 
      - pattern: $DB.Query(...)
      - pattern: $DB.QueryRow(...)
      - pattern: $DB.Exec(...)
      - pattern: $DB.QueryContext(...)
      - pattern: $DB.ExecContext(...)
      - pattern: $TX.Query(...)
      - pattern: $TX.Exec(...)
      - pattern: $GORM.Raw(...)
      - pattern: $GORM.Where(...).Find(...)
      - pattern: $GORM.Exec(...)
      # Command Injection 
      - pattern: exec.Command(...)
      - pattern: exec.CommandContext(...)
      - pattern: syscall.Exec(...)
      - pattern: syscall.ForkExec(...)
      - pattern: syscall.StartProcess(...)
      # Path Traversal / File Access 
      - pattern: os.Open(...)
      - pattern: os.OpenFile(...)
      - pattern: os.ReadFile(...)
      - pattern: os.WriteFile(...)
      - pattern: os.Remove(...)
      - pattern: ioutil.ReadFile(...)
      - pattern: ioutil.WriteFile(...)
      - pattern: filepath.Join(...)
      # SSRF 
      - pattern: http.Get(...)
      - pattern: http.Post(...)
      - pattern: http.NewRequest(...)
      - pattern: $CLIENT.Get(...)
      - pattern: $CLIENT.Do(...)
      # Open Redirect 
      - pattern: http.Redirect(...)
      # XSS 
      - pattern: fmt.Fprintf($W, ...)
      - pattern: $W.Write(...)
      - pattern: template.HTML(...)
      - pattern: $T.Execute($W, ...)
      # LDAP 
      - pattern: $CONN.Search(...)
      # Deserialzation / Code Execution 
      - pattern: gob.NewDecoder($R).Decode(...)
      - pattern: plugin.Open(...)

    pattern-sanitizers:
      # SQL — use parameterized queries 
      - pattern: $DB.Prepare(...)
      # Path 
      - pattern: filepath.Base(...)
      - pattern: filepath.Clean(...)
      # HTML 
      - pattern: html.EscapeString(...)
      - pattern: template.HTMLEscapeString(...)
      # URL 
      - pattern: url.QueryEscape(...)
      - pattern: url.PathEscape(...)
      # Type casting 
      - pattern: strconv.Atoi(...)
      - pattern: strconv.ParseInt(...)
      - pattern: strconv.ParseFloat(...)
