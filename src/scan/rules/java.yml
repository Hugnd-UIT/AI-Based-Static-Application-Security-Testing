rules:
  - id: sinful-taint-java
    mode: taint
    message: "Potential vulnerability: tainted data flows from user-controlled source to dangerous sink."
    severity: WARNING
    languages: [java]
    pattern-sources:
      # Param flow
      - patterns:
          - pattern-inside: |
              $RET $FN(..., $T $P, ...) { ... }
          - pattern: $P

      # Servlet / JAX-RS
      - pattern: $USE_REQ.getParameter(...)
      - pattern: $USE_REQ.getParameterValues(...)
      - pattern: $USE_REQ.getHeader(...)
      - pattern: $USE_REQ.getHeaders(...)
      - pattern: $USE_REQ.getCookies()
      - pattern: $USE_REQ.getInputStream()
      - pattern: $USE_REQ.getReader()
      - pattern: $USE_REQ.getQueryString()
      - pattern: $USE_REQ.getRequestURI()
      - pattern: $USE_REQ.getPathInfo()

      # Spring MVC
      - patterns:
          - pattern-inside: |
              $RET $FN(..., @$ANNO $T $P, ...) { ... }
          - pattern: $P
      - pattern: $GET_MODEL.getAttribute(...)

      # Spring WebFlux 
      - pattern: $EXCHANGE.getRequest().getQueryParams()
      - pattern: $EXCHANGE.getRequest().getHeaders()

      # General 
      - pattern: System.getenv(...)
      - pattern: System.getProperty(...)
    pattern-sinks:
      # SQL Injection 
      - pattern: $STMT.executeQuery(...)
      - pattern: $STMT.executeUpdate(...)
      - pattern: $STMT.execute(...)
      - pattern: $STMT.addBatch(...)
      - pattern: $USE_SESSION.createQuery(...)    
      - pattern: $USE_SESSION.createNativeQuery(...)
      - pattern: $USE_SESSION.createSQLQuery(...)
      - pattern: $EM.createQuery(...)          
      - pattern: $EM.createNativeQuery(...)
      - pattern: (new JdbcTemplate(...)).queryForObject(...)
      - pattern: (new JdbcTemplate(...)).query(...)
      - pattern: (new JdbcTemplate(...)).execute(...)

      # Command Injection 
      - pattern: Runtime.getRuntime().exec(...)
      - pattern: new ProcessBuilder(...)
      - pattern: $BUILDER.command(...)

      # Code Execution / Deserialization 
      - pattern: $OBJ.readObject(...)
      - pattern: XMLDecoder(...)
      - pattern: (new ObjectInputStream(...)).readObject()
      - pattern: Class.forName(...)
      - pattern: $LOADER.loadClass(...)

      # Path Traversal / File Access 
      - pattern: new File(...)
      - pattern: new FileInputStream(...)
      - pattern: new FileOutputStream(...)
      - pattern: Files.readAllBytes(...)
      - pattern: Files.newInputStream(...)
      - pattern: Paths.get(...)

      # SSRF
      - pattern: new URL(...)
      - pattern: new URL(...).openConnection()
      - pattern: new URL(...).openStream()
      - pattern: $URL.openConnection()
      - pattern: $URL.openStream()
      - pattern: $CLIENT.get(...).uri(...)
      - pattern: RestTemplate(...).getForObject(...)

      # Open Redirect 
      - pattern: $RESP.sendRedirect(...)
      - pattern: "redirect:..."

      # XSS 
      - pattern: $RESP.getWriter().print(...)
      - pattern: $RESP.getWriter().println(...)
      - pattern: $RESP.getWriter().write(...)

      # JNDI Injection Log4Shell 
      - pattern: (new InitialContext()).lookup(...)
      - pattern: $CTX.lookup(...)

      # LDAP Injection 
      - pattern: $CTX.search(...)
      - pattern: $CTX.bind(...)

      # XML/XXE 
      - pattern: $FACTORY.newDocumentBuilder().parse(...)
      - pattern: $READER.parse(...)
    pattern-sanitizers:
      # SQL 
      - pattern: $USE_CONN.prepareStatement(...)

      # HTML 
      - pattern: StringEscapeUtils.escapeHtml4(...)
      - pattern: HtmlUtils.htmlEscape(...)

      # Path 
      - pattern: FilenameUtils.getName(...)

      # URL 
      - pattern: URLEncoder.encode(...)

      # Type casting 
      - pattern: Integer.parseInt(...)
      - pattern: Long.parseLong(...)
      - pattern: Double.parseDouble(...)

  # Dynamic SQL/Cmd
  - id: sinful-strcat-java
    message: "SQL or command string built from a variable; verify the value is not attacker controlled."
    severity: WARNING
    languages: [java]
    pattern-either:
      - pattern-regex: '(?i)"(?:\\.|[^"\n]){0,200}(\$where|\b(select|insert|update|delete|drop|union|ping|curl|wget|nc|bash)\b)(?:\\.|[^"\n]){0,200}(\$\{|\$[a-z_]|#\{|\{\}|%[sdvq])'
      - pattern-regex: '(?i)"(?:\\.|[^"\n]){0,200}\b(select|insert|update|delete|drop|union|ping|curl|wget)\b(?:\\.|[^"\n]){0,200}"\s*[+.]\s*[a-z_$]'

  # Weak crypto
  - id: sinful-weakcrypto-java
    message: "Weak or broken cryptographic algorithm."
    severity: WARNING
    languages: [java]
    pattern-regex: '(?i)\b(md5|sha1|des|rc4|ecb|md4)\b'

  # Hardcoded secret
  - id: sinful-secret-java
    message: "Hardcoded credential or cryptographic key."
    severity: WARNING
    languages: [java]
    pattern-regex: '(?i)(\b(secret|password|passwd|pwd|api_?key|private_?key|access_?key|token|salt|encryption_?key|hardcoded)\w*|\b(key|iv|creds?|credential)\b)\s*(=|:|:=|=>)\s*["''][^"''\n]{4,}["'']'