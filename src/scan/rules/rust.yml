rules:
  - id: sinful-taint-rust
    mode: taint
    message: "Potential vulnerability: tainted data flows from user-controlled source to dangerous sink."
    severity: WARNING
    languages: [rust]
    pattern-sources:
      # Tham số hàm, nối luồng khi nguồn nằm ở file khác
      - patterns:
          - pattern-inside: |
              fn $FN(..., $P: $T, ...) { ... }
          - pattern: $P

      # Actix-web
      - pattern: web::Query($PARAMS)
      - pattern: web::Form($PARAMS)
      - pattern: web::Json($PARAMS)
      - pattern: web::Path($PARAMS)
      - pattern: $USE_REQ.query_string()
      - pattern: $USE_REQ.headers()
      - pattern: $USE_REQ.match_info().get(...)

      # Rocket 
      - pattern: rocket::form::Form(...)
      - pattern: rocket::serde::json::Json(...)
      - pattern: $USE_REQ.headers().get(...)
      - pattern: $COOKIES.get(...)

      # Axum 
      - pattern: axum::extract::Query($PARAMS)
      - pattern: axum::extract::Form($PARAMS)
      - pattern: axum::extract::Json($PARAMS)
      - pattern: axum::extract::Path($PARAMS)

      # General 
      - pattern: std::env::var(...)
      - pattern: std::env::args()
    pattern-sinks:
      # SQL Injection 
      - pattern: $USE_DB.execute(...)
      - pattern: $USE_DB.query(...)
      - pattern: $USE_DB.fetch(...)
      - pattern: sqlx::query(...)
      - pattern: sqlx::query_as(...)
      - pattern: diesel::sql_query(...)
      - pattern: diesel::dsl::sql(...)
      - pattern: rusqlite::Connection::execute(...)

      # Command Injection 
      - pattern: std::process::Command::new(...)
      - pattern: Command::new(...)
      - pattern: $RUN_CMD.arg(...)
      - pattern: $RUN_CMD.args(...)

      # Path Traversal / File Access 
      - pattern: std::fs::read(...)
      - pattern: std::fs::read_to_string(...)
      - pattern: std::fs::write(...)
      - pattern: std::fs::remove_file(...)
      - pattern: std::fs::File::open(...)
      - pattern: std::fs::File::create(...)
      - pattern: std::path::Path::new(...)

      # SSRF 
      - pattern: reqwest::get(...)
      - pattern: reqwest::Client::new().get(...)
      - pattern: reqwest::blocking::get(...)
      - pattern: hyper::Client::new().get(...)
      - pattern: ureq::get(...)

      # Deserialization 
      - pattern: serde_json::from_str(...)
      - pattern: serde_json::from_slice(...)
      - pattern: serde_yaml::from_str(...)
      - pattern: bincode::deserialize(...)
      - pattern: ciborium::de::from_reader(...)

      # Code Execution unsafe
      - pattern: libc::system(...)
      - pattern: libc::execve(...)

      # Unsafe memory
      - pattern: $PTR.offset(...)
      - pattern: $PTR.add(...)
      - pattern: $BUF.as_ptr()
      - pattern: $BUF.as_mut_ptr()
      - pattern: $BUF.get_unchecked(...)
      - pattern: std::slice::from_raw_parts(...)
      - pattern: std::ptr::copy(...)
      - pattern: std::mem::transmute(...)
    pattern-sanitizers:
      # SQL — use parameterized/bind approach 
      - pattern: sqlx::query(...)                   # with bind usage 

      # Path 
      - pattern: std::path::Path::new(...).file_name()
      - pattern: std::path::Path::new(...).canonicalize()

      # Type casting safe conversion 
      - pattern: $VAL.parse::<i32>()
      - pattern: $VAL.parse::<u64>()
      - pattern: $VAL.parse::<f64>()

  # Chuỗi SQL hoặc lệnh ghép từ biến, bắt cả khi sink nằm ngoài file
  - id: sinful-strcat-rust
    message: "SQL or command string built from a variable; verify the value is not attacker controlled."
    severity: WARNING
    languages: [rust]
    pattern-either:
      - pattern-regex: '(?i)"(?:\\.|[^"\n]){0,200}(\$where|\b(select|insert|update|delete|drop|union|ping|curl|wget|nc|bash)\b)(?:\\.|[^"\n]){0,200}(\$\{|\$[a-z_]|#\{|\{\}|%[sdvq])'
      - pattern-regex: '(?i)"(?:\\.|[^"\n]){0,200}\b(select|insert|update|delete|drop|union|ping|curl|wget)\b(?:\\.|[^"\n]){0,200}"\s*[+.]\s*[a-z_$]'

  # Thuật toán băm hoặc mã hóa yếu
  - id: sinful-weakcrypto-rust
    message: "Weak or broken cryptographic algorithm."
    severity: WARNING
    languages: [rust]
    pattern-regex: '(?i)\b(md5|sha1|des|rc4|ecb|md4)\b'

  # Bí mật hardcode trong mã nguồn
  - id: sinful-secret-rust
    message: "Hardcoded credential or cryptographic key."
    severity: WARNING
    languages: [rust]
    pattern-regex: '(?i)(\b(secret|password|passwd|pwd|api_?key|private_?key|access_?key|token|salt|encryption_?key|hardcoded)\w*|\b(key|iv|creds?|credential)\b)\s*(=|:|:=|=>)\s*["''][^"''\n]{4,}["'']'
