name: Sinful Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security_scan:
    name: Security Scan (CI)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up dependencies
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute CI Pipeline
        run: |
          python cli/pipeline/ci.py --exit-code 1 --severity ERROR,WARNING --format sarif --output results.sarif
        continue-on-error: true
        id: sast
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        if: always()
        continue-on-error: true
        id: upload_sarif
        
      - name: Check SARIF status
        if: always() && steps.upload_sarif.outcome == 'failure'
        run: |
          echo "::warning::Failed to upload SARIF results to GitHub Advanced Security"
          echo "If your repository is PRIVATE, you must have a GitHub Advanced Security license to use the this feature."

      - name: Check CI status
        if: steps.sast.outcome == 'failure'
        run: |
          echo "::error::Critical vulnerabilities detected! Blocking pipeline."
          exit 1

  deploy_production:
    name: Deploy to Production (CD)
    needs: security_scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up dependencies
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Execute CD Pipeline
        run: |
          python cli/pipeline/cd.py
