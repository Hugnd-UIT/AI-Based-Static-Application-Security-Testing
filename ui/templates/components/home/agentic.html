<section class="sec" id="agentic">
  <div class="ctn">
    <div class="sec-hd rv">
      <h2 class="sec-t"><span class="txt-fire">Agentic</span> SAST</h2>
    </div>

    <div class="ag2-stage rv">
      <div class="ag2-watermark">AUTONOMOUS</div>

      <div class="ag2-dash">
        

        <div class="ag2-chrome">
          <div class="ag2-chrome-dots">
            <span style="background: #ff5f57"></span
            ><span style="background: #ffbd2e"></span
            ><span style="background: #28c840"></span>
          </div>

          <span class="ag2-chrome-title"
            >Sinful-agent  //  mission-control</span
          >

          <div class="ag2-chrome-status">
            <span class="ag2-live-dot"></span><span>AGENT ACTIVE</span>
          </div>
        </div>

        

        <div class="ag2-main">
          

          <div class="ag2-left">
            <div class="ag2-term">
              <div class="ag2-term-head">
                <span style="background: #ff5f57"></span
                ><span style="background: #ffbd2e"></span
                ><span style="background: #28c840"></span>
              </div>

              <div class="ag2-term-body">
                <span class="ag2-prompt">human $</span>
                <span class="ag2-typed" id="ag2Typed"></span
                ><span class="ag2-cursor"></span
                ><span class="ag2-enter" id="ag2Enter">⏎</span>
              </div>
            </div>

            <div class="ag2-brain">
              <div class="ag2-brain-orb">
                <div class="ag2-brain-glow"></div>

                <div class="ag2-brain-r1"></div>

                <div class="ag2-brain-r2"></div>

                <div class="ag2-brain-core">
                  <svg fill="none" stroke-width="1.5" viewbox="0 0 24 24">
                    <path
                      d="M12 2a4 4 0 014 4c0 1.95-2 3-2 8h-4c0-5-2-6.05-2-8a4 4 0 014-4z"
                    ></path>

                    <path d="M10 14h4"></path>

                    <path d="M10 17h4"></path>

                    <path d="M11 20h2"></path>
                  </svg>
                </div>
              </div>

              <div class="ag2-brain-label" id="ag2BrainLabel"></div>
            </div>

            <div class="ag2-plan">
              <div class="ag2-plan-header">EXECUTION GRAPH</div>

              <div class="ag2-plan-dots" id="ag2PlanDots">
                <div class="ag2-plan-dot"></div>

                <div class="ag2-plan-dot"></div>

                <div class="ag2-plan-dot"></div>

                <div class="ag2-plan-dot"></div>

                <div class="ag2-plan-dot"></div>

                <div class="ag2-plan-dot"></div>
              </div>
            </div>
          </div>

          

          <div class="ag2-center">
            <div class="ag2-rail">
              <div class="ag2-rail-line"></div>

              <div class="ag2-rail-fill" id="ag2RailFill"></div>

              <div class="ag2-rail-energy" id="ag2Energy"></div>
            </div>

            <div class="ag2-timeline" id="ag2Timeline">
              <div
                class="ag2-step"
                data-step="0"
                style="--sc: var(--fire); --sg: rgba(255, 74, 20, 0.2)"
              >
                <div class="ag2-step-node">
                  <div class="ag2-step-pulse"></div>

                  <svg viewbox="0 0 24 24">
                    <path
                      d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
                    ></path>
                  </svg>
                </div>

                <div class="ag2-step-card">
                  <div class="ag2-step-head">
                    <span class="ag2-step-num">01</span
                    ><span class="ag2-step-name">DEEP SCAN</span
                    ><span class="ag2-step-st" id="ag2St0"></span>
                  </div>

                  <div class="ag2-step-out" id="ag2Out0"></div>

                  <div class="ag2-step-metrics" id="ag2M0"></div>
                </div>
              </div>

              <div
                class="ag2-step"
                data-step="1"
                style="--sc: var(--rose); --sg: rgba(244, 63, 94, 0.2)"
              >
                <div class="ag2-step-node">
                  <div class="ag2-step-pulse"></div>

                  <svg viewbox="0 0 24 24">
                    <path
                      d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"
                    ></path>

                    <line x1="12" x2="12" y1="9" y2="13"></line>

                    <line x1="12" x2="12.01" y1="17" y2="17"></line>
                  </svg>
                </div>

                <div class="ag2-step-card">
                  <div class="ag2-step-head">
                    <span class="ag2-step-num">02</span
                    ><span class="ag2-step-name">FIND VULNS</span
                    ><span class="ag2-step-st" id="ag2St1"></span>
                  </div>

                  <div class="ag2-step-out" id="ag2Out1"></div>

                  <div class="ag2-step-metrics" id="ag2M1"></div>
                </div>
              </div>

              <div
                class="ag2-step"
                data-step="2"
                style="--sc: var(--emerald); --sg: rgba(16, 185, 129, 0.2)"
              >
                <div class="ag2-step-node">
                  <div class="ag2-step-pulse"></div>

                  <svg viewbox="0 0 24 24">
                    <path d="M12 20h9"></path>

                    <path
                      d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"
                    ></path>
                  </svg>
                </div>

                <div class="ag2-step-card">
                  <div class="ag2-step-head">
                    <span class="ag2-step-num">03</span
                    ><span class="ag2-step-name">AUTO-FIX</span
                    ><span class="ag2-step-st" id="ag2St2"></span>
                  </div>

                  <div class="ag2-step-out" id="ag2Out2"></div>

                  <div class="ag2-step-metrics" id="ag2M2"></div>
                </div>
              </div>

              <div
                class="ag2-step"
                data-step="3"
                style="--sc: var(--violet); --sg: rgba(139, 92, 246, 0.2)"
              >
                <div class="ag2-step-node">
                  <div class="ag2-step-pulse"></div>

                  <svg viewbox="0 0 24 24">
                    <circle cx="12" cy="12" r="4"></circle>

                    <line x1="1.05" x2="7" y1="12" y2="12"></line>

                    <line x1="17.01" x2="22.96" y1="12" y2="12"></line>
                  </svg>
                </div>

                <div class="ag2-step-card">
                  <div class="ag2-step-head">
                    <span class="ag2-step-num">04</span
                    ><span class="ag2-step-name">PR &amp; TICKETS</span
                    ><span class="ag2-step-st" id="ag2St3"></span>
                  </div>

                  <div class="ag2-step-out" id="ag2Out3"></div>

                  <div class="ag2-step-metrics" id="ag2M3"></div>
                </div>
              </div>

              <div
                class="ag2-step"
                data-step="4"
                style="--sc: var(--amber); --sg: rgba(245, 158, 11, 0.2)"
              >
                <div class="ag2-step-node">
                  <div class="ag2-step-pulse"></div>

                  <svg viewbox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>

                <div class="ag2-step-card">
                  <div class="ag2-step-head">
                    <span class="ag2-step-num">05</span
                    ><span class="ag2-step-name">RUN TESTS</span
                    ><span class="ag2-step-st" id="ag2St4"></span>
                  </div>

                  <div class="ag2-step-out" id="ag2Out4"></div>

                  <div class="ag2-step-metrics" id="ag2M4"></div>
                </div>
              </div>

              <div
                class="ag2-step"
                data-step="5"
                style="--sc: var(--cyan); --sg: rgba(0, 212, 255, 0.2)"
              >
                <div class="ag2-step-node">
                  <div class="ag2-step-pulse"></div>

                  <svg viewbox="0 0 24 24">
                    <path d="M22 2L11 13"></path>

                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                  </svg>
                </div>

                <div class="ag2-step-card">
                  <div class="ag2-step-head">
                    <span class="ag2-step-num">06</span
                    ><span class="ag2-step-name">DEPLOY &amp; NOTIFY</span
                    ><span class="ag2-step-st" id="ag2St5"></span>
                  </div>

                  <div class="ag2-step-out" id="ag2Out5"></div>

                  <div class="ag2-step-metrics" id="ag2M5"></div>
                </div>
              </div>
            </div>
          </div>

          

          <div class="ag2-right">
            <div class="ag2-rh">LIVE RESULTS</div>

            <div class="ag2-stats">
              <div class="ag2-stat">
                <span
                  class="ag2-stat-val"
                  id="ag2Files"
                  style="color: var(--fire)"
                  >0</span
                ><span class="ag2-stat-label">FILES</span>
              </div>

              <div class="ag2-stat">
                <span
                  class="ag2-stat-val"
                  id="ag2Vulns"
                  style="color: var(--rose)"
                  >0</span
                ><span class="ag2-stat-label">VULNS</span>
              </div>

              <div class="ag2-stat">
                <span
                  class="ag2-stat-val"
                  id="ag2Fixed"
                  style="color: var(--emerald)"
                  >0</span
                ><span class="ag2-stat-label">FIXED</span>
              </div>
            </div>

            <div class="ag2-feed" id="ag2Feed"></div>

            <div class="ag2-summary" id="ag2Summary">
              MISSION COMPLETE — 12 vulns found → 12 fixed → 0 remaining
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="rv" style="text-align: center; margin-top: 40px">
      <a class="js-open-demo btn btn-fire btn-lg">Try Agentic SAST</a>
    </div>
  </div>
</section>
